spring:
  application:
    name: api
  datasource:
    url: jdbc:postgresql://localhost:5432/api
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    generate-ddl: false
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true
